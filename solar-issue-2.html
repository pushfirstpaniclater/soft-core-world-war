<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>SOLAR ARCHIVE II</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Lucida Console",Monaco,"Courier New",monospace}
    body{padding:18px 18px 110px}
    header{max-width:1500px;margin:0 auto 9vh;padding-top:2px}
    h1{margin:0;font-size:clamp(34px,6vw,92px);font-weight:400;line-height:.84;letter-spacing:-.08em}
    .note{margin-top:14px;font-size:11px;color:#8d8d8d;letter-spacing:.16em}
    .gallery{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:dense;column-gap:clamp(10px,1.5vw,28px);row-gap:clamp(80px,13vw,220px);align-items:start}
    .piece{display:block;text-decoration:none;color:inherit}
    .piece img{display:block;width:100%;height:auto}
    .piece:nth-child(12n+1){grid-column:1/span 7}
    .piece:nth-child(12n+2){grid-column:9/span 4;margin-top:14vh}
    .piece:nth-child(12n+3){grid-column:2/span 4;margin-top:4vh}
    .piece:nth-child(12n+4){grid-column:6/span 7;margin-top:-5vh}
    .piece:nth-child(12n+5){grid-column:1/span 3;margin-top:18vh}
    .piece:nth-child(12n+6){grid-column:5/span 5}
    .piece:nth-child(12n+7){grid-column:8/span 5;margin-top:11vh}
    .piece:nth-child(12n+8){grid-column:2/span 9}
    .piece:nth-child(12n+9){grid-column:1/span 12;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
    .piece:nth-child(12n+9) img{width:100vw}
    .piece:nth-child(12n+10){grid-column:3/span 3;margin-top:12vh}
    .piece:nth-child(12n+11){grid-column:7/span 6;margin-top:-3vh}
    .piece:nth-child(12n+12){grid-column:4/span 5;margin-top:9vh}
    .empty{max-width:1500px;margin:60px auto;font-size:18px;color:#888}
    .back,.lock{position:fixed;bottom:14px;z-index:40;padding:9px 11px;border:1px solid #fff;background:#000;color:#fff;font:12px/1 "Lucida Console",Monaco,"Courier New",monospace;text-decoration:none;cursor:pointer}
    .back{left:14px}.lock{right:14px}
    .back:hover,.lock:hover{background:#fff;color:#000}
    footer{max-width:1500px;margin:18vh auto 0;color:#666;font-size:10px;letter-spacing:.18em}
    @media(max-width:760px){
      body{padding:12px 12px 90px}
      header{margin-bottom:11vh}
      .gallery{grid-template-columns:repeat(6,minmax(0,1fr));column-gap:10px;row-gap:22vw}
      .piece:nth-child(12n+1){grid-column:1/span 5}
      .piece:nth-child(12n+2){grid-column:3/span 4;margin-top:8vh}
      .piece:nth-child(12n+3){grid-column:1/span 3;margin-top:0}
      .piece:nth-child(12n+4){grid-column:2/span 5;margin-top:0}
      .piece:nth-child(12n+5){grid-column:1/span 2;margin-top:8vh}
      .piece:nth-child(12n+6){grid-column:3/span 4}
      .piece:nth-child(12n+7){grid-column:2/span 5;margin-top:4vh}
      .piece:nth-child(12n+8){grid-column:1/span 6}
      .piece:nth-child(12n+9){grid-column:1/span 6}
      .piece:nth-child(12n+10){grid-column:1/span 3;margin-top:6vh}
      .piece:nth-child(12n+11){grid-column:3/span 4;margin-top:0}
      .piece:nth-child(12n+12){grid-column:2/span 4;margin-top:5vh}
    }
  </style>
<style id="scww-hide-legacy-radio">.player{display:none!important}</style>
</head>
<body>
  <button class="lock" id="lock">LOCK</button>
  <header>
    <h1>SOLAR ARCHIVE II</h1>
    <div class="note">PRIVATE IMAGE FILE / ISSUE 02</div>
  </header>
  <main class="gallery" id="gallery"></main>
  <footer>END OF ISSUE II</footer>
  <a class="back" href="gallery.html">← ISSUE I</a>
  <script src="assets/solar-issue-2/manifest.js"></script>
  <script>
    (()=>{'use strict';
      const ACCESS_KEY='scwwSolarIssue2Access';
      const ACCESS_VALUE='inverse-solar-session-2a90f6';
      const COOKIE_NAME='scwwSolarIssue2Cookie';
      const hasCookie=()=>document.cookie.split('; ').some(entry=>entry===`${COOKIE_NAME}=${ACCESS_VALUE}`);
      if(!hasCookie()&&sessionStorage.getItem(ACCESS_KEY)!==ACCESS_VALUE){location.replace('/solar-issue-2-gate.html');return}

      document.getElementById('lock').addEventListener('click',()=>{
        sessionStorage.removeItem(ACCESS_KEY);
        const secure=location.protocol==='https:'?'; Secure':'';
        document.cookie=`${COOKIE_NAME}=; Max-Age=0; Path=/; SameSite=Lax${secure}`;
        location.replace('/solar-issue-2-gate.html');
      });

      const root=document.getElementById('gallery');
      const safeFiles=files=>(Array.isArray(files)?files:[]).filter(file=>
        typeof file==='string'&&!file.includes('..')&&!file.includes('/')&&!file.includes('\\')&&!file.startsWith('manifest.')
      );

      const render=files=>{
        const valid=safeFiles(files);
        if(!valid.length){root.outerHTML='<div class="empty">ISSUE II IS EMPTY.</div>';return}
        valid.forEach((file,index)=>{
          const url=`assets/solar-issue-2/${encodeURIComponent(file)}`;
          const link=document.createElement('a');
          link.className='piece';
          link.href=url;
          link.target='_blank';
          link.rel='noopener noreferrer';
          link.setAttribute('aria-label',`Open image ${index+1}`);
          const img=document.createElement('img');
          img.src=url;
          img.alt='';
          img.loading=index<3?'eager':'lazy';
          link.append(img);
          root.append(link);
        });
      };

      if(location.protocol==='file:'){
        render(window.SCWW_SOLAR_ISSUE_2_PHOTOS||[]);
      }else{
        fetch('assets/solar-issue-2/manifest.json',{cache:'no-store',credentials:'omit'})
          .then(response=>response.ok?response.json():[])
          .then(render)
          .catch(()=>render(window.SCWW_SOLAR_ISSUE_2_PHOTOS||[]));
      }
    })();
  </script>
<script src="/assets/radio.js?v=20260807-seamless-v5"></script>
<script src="/assets/site-router.js?v=20260807-seamless-v4"></script>
</body>
</html>
