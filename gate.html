<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLAR ACCESS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#ffe900;font-family:"Lucida Console",Monaco,"Courier New",monospace}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,rgba(255,119,0,.24),transparent 32%),#050505}.gate{width:min(92vw,520px);border:2px solid #ffe900;background:rgba(0,0,0,.92);padding:28px;box-shadow:0 0 30px rgba(255,106,0,.55);text-align:center}.sun{width:120px;height:120px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,#fffbd0 0 2%,#ffe66d 8%,#ff9d00 35%,#d93400 68%,#3b0000 100%);box-shadow:0 0 20px #ffcf33,0 0 48px #ff4d00}.gate h1{margin:0 0 8px;color:#ff3b3b;font-size:28px}.gate p{color:#26ecff;line-height:1.5}.gate input{width:100%;padding:13px;background:#090909;border:1px solid #ff46ff;color:#fff;font:inherit;text-align:center;outline:none}.gate button{width:100%;margin-top:12px;padding:13px;background:#111;border:1px solid #ffe900;color:#ffe900;font:inherit;cursor:pointer}.gate button:hover{background:#ffe900;color:#000}.status{min-height:22px;margin-top:12px;color:#ff46ff}.back{display:inline-block;margin-top:16px;color:#54ff3d;text-decoration:none}</style></head><body><main class="gate"><div class="sun"></div><h1>SOLAR ARCHIVE ACCESS</h1><p>ENTER THE NAME OF THE GUARDIAN.</p><form id="gateForm"><input id="password" type="password" autocomplete="current-password" autofocus aria-label="Password"><button type="submit">OPEN THE PORTAL</button></form><div class="status" id="status"></div><a class="back" href="index.html">← RETURN TO TRANSMISSION</a></main><script>const form=document.getElementById('gateForm'),input=document.getElementById('password'),status=document.getElementById('status');form.addEventListener('submit',e=>{e.preventDefault();if(input.value==='James Salamander'){sessionStorage.setItem('scwwGalleryAccess','granted');location.href='gallery.html'}else{status.textContent='ACCESS DENIED';input.select()}});</script></body></html>
