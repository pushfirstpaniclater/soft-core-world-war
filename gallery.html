<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCWW PHOTO ARCHIVE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:"Lucida Console",Monaco,"Courier New",monospace}body{background:radial-gradient(circle at 50% 0,rgba(255,119,0,.16),transparent 30%),linear-gradient(135deg,#070707,#120312 58%,#051112);padding:24px}header{text-align:center;margin:0 auto 28px;max-width:900px}h1{color:#ff2929;text-shadow:2px 2px #000;margin:0 0 8px}.sub{color:#ffe900}.grid{max-width:1300px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{display:block;border:1px solid #26ecff;background:#000;padding:6px;box-shadow:0 0 12px rgba(38,236,255,.2)}.card img{width:100%;height:310px;display:block;object-fit:cover;background:#111}.card span{display:block;padding:8px 4px 3px;color:#ff46ff;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{grid-column:1/-1;border:1px dashed #ffe900;padding:36px;text-align:center;color:#54ff3d}.back{display:inline-block;margin-top:14px;color:#26ecff;text-decoration:none}.lock{position:fixed;right:16px;top:14px;color:#ffe900;background:#000;border:1px solid #ffe900;padding:8px 10px;cursor:pointer;font:inherit}</style></head><body><button class="lock" id="lock">LOCK</button><header><h1>THE SOLAR PHOTO ARCHIVE</h1><div class="sub">PRIVATE IMAGES / PUBLIC LIGHT</div><a class="back" href="index.html">← RETURN TO TRANSMISSION</a></header><main class="grid" id="gallery"></main><script>if(sessionStorage.getItem('scwwGalleryAccess')!=='granted')location.replace('gate.html');document.getElementById('lock').onclick=()=>{sessionStorage.removeItem('scwwGalleryAccess');location.replace('gate.html')};const root=document.getElementById('gallery');fetch('assets/photos/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(files=>{if(!Array.isArray(files)||!files.length){root.innerHTML='<div class="empty">THE ARCHIVE IS EMPTY. UPLOAD IMAGES TO assets/photos/ AND ADD THEIR FILENAMES TO manifest.json.</div>';return}for(const file of files){const a=document.createElement('a');a.className='card';a.href='assets/photos/'+encodeURIComponent(file);a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.loading='lazy';img.alt=file;img.src='assets/photos/'+encodeURIComponent(file);const label=document.createElement('span');label.textContent=file;a.append(img,label);root.append(a)}}).catch(()=>root.innerHTML='<div class="empty">ARCHIVE SIGNAL LOST.</div>');</script></body></html>
