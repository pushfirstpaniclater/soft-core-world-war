<!doctype html>

<head>
<meta charset="utf-8">

<title>VISUAL SIGNAL — SOFT CORE WORLD WAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050706;color:#eaffea;font-family:"Lucida Console",Monaco,"Courier New",monospace}body{padding:18px 215px 70px 18px;background:radial-gradient(circle at 50% 0,rgba(0,255,160,.08),transparent 34%),#050706}.top{max-width:1200px;margin:0 auto 16px;border-top:7px solid #ff2cff;padding-top:10px}.back{color:#26ecff;text-decoration:none}.top h1{margin:12px 0 2px;color:#ff2cff;font-size:clamp(30px,6vw,74px);line-height:.85;letter-spacing:-.06em}.sub{color:#7fff6a;font-size:12px}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}.signal{position:relative;aspect-ratio:16/10;border:2px solid #26ecff;background:#000;overflow:hidden;box-shadow:8px 8px 0 rgba(255,46,255,.12)}.signal video{width:100%;height:100%;display:block;object-fit:cover;background:#000}.label{position:absolute;left:7px;top:7px;z-index:2;padding:4px 6px;background:#000;color:#ffe900;border:1px solid #ffe900;font-size:10px}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#54ff3d;text-align:center;padding:20px;font-size:12px;line-height:1.5;background:repeating-linear-gradient(0deg,#060806 0 3px,#090d09 3px 6px)}.controls{max-width:1200px;margin:20px auto 0;display:flex;gap:10px;flex-wrap:wrap}.controls button{background:#0b0d0b;color:#ffe900;border:1px solid #ffe900;padding:10px 13px;font:inherit;cursor:pointer}.controls button:hover{background:#ffe900;color:#000}.note{max-width:1200px;margin:14px auto;color:#7fff6a;font-size:11px;line-height:1.5}@media(max-width:950px){body{padding-right:18px;padding-bottom:210px}}@media(max-width:680px){.grid{grid-template-columns:1fr}.signal{aspect-ratio:4/3}.top h1{font-size:42px}}

<body>
<header class="top"><a class="back" href="index.html">&lt;&lt; RETURN TO TRANSMISSION</a><h1>VISUAL SIGNAL</h1><div class="sub">FOUR CHANNELS // SOURCE UNKNOWN // MUTED BY DEFAULT</div></header>
<main class="grid" id="grid"></main>
<div class="controls"><button id="randomize">RANDOMIZE ALL SIGNALS</button><button id="toggle">PAUSE ALL</button><button id="mute">UNMUTE ALL</button></div>
<div class="note">Drop MP4, WEBM, MOV, M4V, or OGV files into <strong>assets/visual-signals/</strong>. The manifest updates automatically after the upload commit.</div>
<script>
(()=>{'use strict';const root=document.getElementById('grid'),randomize=document.getElementById('randomize'),toggle=document.getElementById('toggle'),mute=document.getElementById('mute');let files=[],paused=false,muted=true;const safe=f=>typeof f==='string'&&!f.includes('..')&&!f.includes('/')&&!f.includes('\\');function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(){root.innerHTML='';const chosen=shuffle([...files]).slice(0,4);for(let i=0;i<4;i++){const box=document.createElement('section');box.className='signal';box.innerHTML=`<div class="label">VISUAL SIGNAL ${String(i+1).padStart(2,'0')}</div>`;const file=chosen[i];if(file){const v=document.createElement('video');v.src='assets/visual-signals/'+encodeURIComponent(file);v.autoplay=true;v.loop=true;v.muted=muted;v.playsInline=true;v.preload='metadata';v.controls=true;box.append(v)}else{const e=document.createElement('div');e.className='empty';e.textContent='NO SIGNAL\nUPLOAD VIDEO FILES TO assets/visual-signals/';box.append(e)}root.append(box)}}function videos(){return [...root.querySelectorAll('video')]}randomize.onclick=render;toggle.onclick=()=>{paused=!paused;videos().forEach(v=>paused?v.pause():v.play().catch(()=>{}));toggle.textContent=paused?'PLAY ALL':'PAUSE ALL'};mute.onclick=()=>{muted=!muted;videos().forEach(v=>v.muted=muted);mute.textContent=muted?'UNMUTE ALL':'MUTE ALL'};fetch('assets/visual-signals/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(x=>{files=Array.isArray(x)?x.filter(safe):[];render()}).catch(render)})();
</script>
<script src="/assets/radio.js?v=20260807-persist-v2"></script>
</body>
