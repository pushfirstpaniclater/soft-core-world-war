name: Install site-wide radio

on:
  push:
    branches: [main]
    paths:
      - assets/radio.js
      - assets/site-router.js
      - .github/workflows/install-site-radio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add shared radio to every page except games
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          radio_tag = '<script src="/assets/radio.js?v=20260807-seamless-v3"></script>'
          router_tag = '<script src="/assets/site-router.js?v=20260807-seamless-v3"></script>'
          radio_re = re.compile(
              r'\s*<script\s+src=["\'](?:/|(?:\.\./)*|\./)?assets/radio\.js(?:\?[^"\']*)?["\']\s*></script>\s*',
              re.I,
          )
          router_re = re.compile(
              r'\s*<script\s+src=["\'](?:/|(?:\.\./)*|\./)?assets/site-router\.js(?:\?[^"\']*)?["\']\s*></script>\s*',
              re.I,
          )
          old_autoplay_re = re.compile(
              r'\s*<script\s+src=["\'](?:/|(?:\.\./)*|\./)?assets/page-autoplay\.js(?:\?[^"\']*)?["\']\s*></script>\s*',
              re.I,
          )
          changed = []

          for page in Path('.').rglob('*.html'):
              if '.git' in page.parts:
                  continue

              text = page.read_text(encoding='utf-8')
              cleaned = radio_re.sub('\n', text)
              cleaned = router_re.sub('\n', cleaned)
              cleaned = old_autoplay_re.sub('\n', cleaned)

              # Games is intentionally silent except for its own cabinet audio.
              if page.as_posix() == 'games.html':
                  updated = cleaned
              elif '</body>' in cleaned.lower():
                  match = re.search(r'</body>', cleaned, flags=re.I)
                  updated = cleaned[:match.start()] + radio_tag + '\n' + router_tag + '\n' + cleaned[match.start():]
              else:
                  updated = cleaned

              if updated != text:
                  page.write_text(updated, encoding='utf-8')
                  changed.append(str(page))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit page wiring
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- '*.html' archive
            git commit -m "install seamless persistent radio except games"
            git push origin HEAD:main
          fi
      - name: Publish current site branch
        run: git push origin HEAD:gh-pages --force
