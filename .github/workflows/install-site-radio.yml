name: Install site-wide radio

on:
  push:
    branches: [main]
    paths:
      - assets/radio.js
      - .github/workflows/install-site-radio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add shared radio to every page
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="assets/radio.js"></script>'
          changed = []
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if tag in text:
                  continue
              if '</body>' not in text:
                  continue
              page.write_text(text.replace('</body>', tag + '\n</body>', 1), encoding='utf-8')
              changed.append(str(page))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit page wiring
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "wire persistent radio into every page"
            git push origin HEAD:main
          fi
      - name: Publish current site branch
        run: git push origin HEAD:gh-pages --force
