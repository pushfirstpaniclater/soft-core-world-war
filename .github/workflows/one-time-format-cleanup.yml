name: One-time cosmetic formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-format-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format human-authored source files
        run: |
          npx --yes prettier@3.3.3 --write \
            '*.html' \
            'assets/*.js' \
            'assets/visual-signals/*.md' \
            '.github/workflows/*.yml' \
            '.github/workflows/*.yaml' \
            'README.md' \
            2>/dev/null || true

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-format-cleanup.yml

      - name: Commit cosmetic-only cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: format source without changing behavior'
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
