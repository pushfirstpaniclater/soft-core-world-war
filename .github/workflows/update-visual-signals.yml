name: Update visual signal manifest

on:
  push:
    branches: [main]
    paths:
      - 'assets/visual-signals/**'
      - 'visual-signal.html'
      - '.github/workflows/update-visual-signals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build manifest and add homepage link
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          folder = Path('assets/visual-signals')
          allowed = {'.mp4', '.webm', '.mov', '.m4v', '.ogv'}
          files = sorted(p.name for p in folder.iterdir() if p.is_file() and p.suffix.lower() in allowed)
          (folder / 'manifest.json').write_text(json.dumps(files, indent=2) + '\n', encoding='utf-8')

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          link = '<div class="section"><a class="news-link" href="visual-signal.html">VISUAL SIGNAL!</a></div>'
          if 'href="visual-signal.html"' not in html:
              marker = '<div class="green section" id="phaseHeading">'
              html = html.replace(marker, link + '\n' + marker)
              page.write_text(html, encoding='utf-8')
          PY
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/visual-signals/manifest.json
          git diff --cached --quiet || git commit -m 'refresh visual signal broadcast'
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
