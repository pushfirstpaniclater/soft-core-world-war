name: Install persistent language preference

on:
  push:
    branches: [main]
    paths:
      - 'assets/language-persistence.js'
      - '.github/workflows/install-language-persistence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject language persistence script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/language-persistence.js"></script>'
          if tag not in s:
              marker='<script src="assets/radio.js"></script>'
              if marker in s:
                  s=s.replace(marker,tag+'\n'+marker)
              else:
                  s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'wire persistent language preference'
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
